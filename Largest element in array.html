<!DOCTYPE html>
<html
<head>
    <title>Largest element in array</title>
</head>
<body>
    <script>
     let arr = [7, 10, 25, 24, 15, 4];
     let largest = arr[0];
     for (let i = 1; i < arr.length; i++) {
        if (arr[i] > largest) 
        {
        largest = arr[i];
    }
}
document.write("Largest element = " + largest);
    </script>
</body>
</html>
