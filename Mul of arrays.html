<!DOCTYPE html>
<html
<head>
    <title>Mul of arrays</title>
</head>
<body>
    <script>
        let arr=[7, 10, 25, 24, 4, 15];
        let mul=1;
        for(let i=1; i<arr.length;i++)
    {
        mul = mul *arr[i];
    }
        document.write("Mul ="+ mul);
    </script>
</body>
</html>
