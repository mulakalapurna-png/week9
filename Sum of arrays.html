
<!DOCTYPE html>
<html>
<head>
    <title>Sum Of Arrays</title>
</head>
<body>
    <script>
        let arr = [7, 10, 25, 24, 4, 15];
        let sum = 0;

        for (let i = 0; i < arr.length; i++)
        {
            sum = sum + arr[i];
        }

        document.write("sum = " + sum);
    </script>
</body>
</html>
